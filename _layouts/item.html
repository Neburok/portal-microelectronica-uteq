---
layout: default
---
<article class="article container narrow">
  <a class="back-link" href="{{ '/' | relative_url }}">← Inicio</a>
  <p class="eyebrow eyebrow-dark">{{ page.section }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.status %}<p><span class="status status-{{ page.status_key | default: 'info' }}">{{ page.status }}</span></p>{% endif %}
  <div class="article-body">{{ content }}</div>
</article>
